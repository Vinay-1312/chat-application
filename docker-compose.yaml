services:
  envoy:
    image: envoyproxy/envoy:v1.29-latest
    container_name: envoy
    ports:
      - "10000:10000"
      - "9901:9901"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
    networks:
      - envoymesh
    depends_on:
      - service1
      - service2
      - service3

  service1:
    build: ./backend
    container_name: chat-node-1
    environment:
      - PORT=3000
      - DB_HOST=postgres
      - DB_NAME=chatdb
      - DB_USER=chat
      - DB_PASSWORD=chatpass
      - REDIS_HOST=redis
      - JWT_SECRET=supersecretkey
    networks:
      - envoymesh
    depends_on:
      - postgres
      - redis

  service2:
    build: ./backend
    container_name: chat-node-2
    environment:
      - PORT=3000
      - DB_HOST=postgres
      - DB_NAME=chatdb
      - DB_USER=chat
      - DB_PASSWORD=chatpass
      - REDIS_HOST=redis
      - JWT_SECRET=supersecretkey
    networks:
      - envoymesh
    depends_on:
      - postgres
      - redis

  service3:
    build: ./backend
    container_name: chat-node-3
    environment:
      - PORT=3000
      - DB_HOST=postgres
      - DB_NAME=chatdb
      - DB_USER=chat
      - DB_PASSWORD=chatpass
      - REDIS_HOST=redis
      - JWT_SECRET=supersecretkey
    networks:
      - envoymesh
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=chatdb
      - POSTGRES_USER=chat
      - POSTGRES_PASSWORD=chatpass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - envoymesh

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - envoymesh

  frontend:
    build: ./frontend
    container_name: chat-frontend
    ports:
      - "5173:5173"
    networks:
      - envoymesh

networks:
  envoymesh:
    driver: bridge

volumes:
  postgres_data:
