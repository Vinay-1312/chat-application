# --- Sink: Redis Streams ---
debezium.sink.type=redis
debezium.sink.redis.address=redis:6379
# stream name per table: chatdb.public.messages
debezium.sink.redis.message.format=extended

# --- Source: Postgres connector ---
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=chat
debezium.source.database.password=chatpass
debezium.source.database.dbname=chatdb

# prefix for Redis stream names: {prefix}.public.messages
debezium.source.topic.prefix=chatdb

# only watch the messages table
debezium.source.table.include.list=public.messages

# pgoutput is built into Postgres 10+ — no extra plugin needed
debezium.source.plugin.name=pgoutput
debezium.source.publication.name=debezium_pub
debezium.source.slot.name=debezium_slot

# send timestamps as ISO strings instead of raw microseconds
debezium.source.time.precision.mode=connect

# strip schema metadata — keeps payloads small
debezium.format.value.schemas.enable=false
debezium.format.key.schemas.enable=false
